<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  </style>
</helmet>
<x-import component-from-global-scope="Stage" from="./animations.jsx"
  width="{{ w }}" height="{{ h }}" duration="{{ dur }}" background="#05070F"
  loop="{{ loop }}" hint-size="100%,100%">
  {{ scene }}
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:780},&quot;packLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Gym Bag Bundle&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Purchase&quot;},&quot;bonusLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+30% BONUS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Purchase&quot;},&quot;amount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6500,&quot;min&quot;:100,&quot;max&quot;:50000,&quot;step&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Purchase&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$9.99&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Purchase&quot;},&quot;oldBalance&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2480,&quot;min&quot;:0,&quot;max&quot;:100000,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Purchase&quot;},&quot;continueLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CONTINUE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Purchase&quot;}}">
class Component extends DCLogic {
  state = { ready: false };

  componentDidMount() {
    const poll = () => {
      if (window.Stage && window.useTime && window.Easing && window.animate && window.clamp) {
        this.setState({ ready: true });
      } else {
        setTimeout(poll, 60);
      }
    };
    setTimeout(poll, 120);
  }

  renderVals() {
    const base = { w: 390, h: 780, dur: 7.4, loop: true, scene: null };
    if (!this.state.ready) return base;

    const e = React.createElement;
    const { useTime, Easing, animate, clamp } = window;
    const P = this.props || {};

    const GOLD0 = '#F5A524', GOLD1 = '#FFD787', GOLD2 = '#C97A0C', DARK = '#2C1D0B';
    const RGB = '245,165,36';
    const AURA0 = '#4D8CFF', AURA1 = '#9D4EDD';

    const packLabel   = P.packLabel   || 'Gym Bag Bundle';
    const bonusLabel  = P.bonusLabel  || '+30% BONUS';
    const amount      = Number(P.amount)      || 6500;
    const price       = P.price       || '$9.99';
    const oldBalance  = Number(P.oldBalance)  || 2480;
    const continueLabel = P.continueLabel || 'CONTINUE';
    const newBalance = oldBalance + amount;

    const mono = "'JetBrains Mono',monospace";
    const disp = "'Chakra Petch',sans-serif";
    const bodyF = "'Hanken Grotesk',sans-serif";
    const fmt = (n) => Math.round(n).toLocaleString('en-US');

    const PANEL_W = 322;
    const CY = '40%';
    const BURST = 1.7;

    function hexCoin(size, glowAmt) {
      glowAmt = glowAmt == null ? 0.55 : glowAmt;
      return e('svg', { width: size, height: size, viewBox: '0 0 64 64',
        style: { filter: `drop-shadow(0 0 ${size * 0.22}px rgba(${RGB},${glowAmt}))`, display: 'block' } },
        e('defs', null,
          e('linearGradient', { id: 'hc-g', x1: '.15', y1: '0', x2: '.85', y2: '1' },
            e('stop', { offset: '0%', stopColor: GOLD1 }),
            e('stop', { offset: '55%', stopColor: GOLD0 }),
            e('stop', { offset: '100%', stopColor: GOLD2 }),
          )
        ),
        e('circle', { cx: 32, cy: 32, r: 30, fill: 'url(#hc-g)' }),
        e('circle', { cx: 32, cy: 32, r: 24.5, fill: 'none', stroke: 'rgba(44,29,11,.28)', strokeWidth: '2' }),
        e('g', { fill: DARK },
          e('rect', { x: 29, y: 1.5, width: 6, height: 8, rx: 1.5 }),
          e('rect', { x: 29, y: 54.5, width: 6, height: 8, rx: 1.5 }),
          e('rect', { x: 1.5, y: 29, width: 8, height: 6, rx: 1.5 }),
          e('rect', { x: 54.5, y: 29, width: 8, height: 6, rx: 1.5 }),
        ),
        e('polygon', { points: '32,20 42,26 42,38 32,44 22,38 22,26', fill: DARK }),
        e('polygon', { points: '32,25.5 37.5,28.7 37.5,35.3 32,38.5 26.5,35.3 26.5,28.7', fill: 'url(#hc-g)' })
      );
    }

    // ── Converging spark particles pulled INTO the coin ───────────────────
    function Converge() {
      const t = useTime();
      const N = 18;
      return e('div', { style: { position: 'absolute', left: '50%', top: CY, width: 0, height: 0, pointerEvents: 'none' } },
        ...Array.from({ length: N }, (_, i) => {
          const ang = (i / N) * Math.PI * 2 + i * 0.6;
          const s = 0.6 + (i % 6) * 0.11;
          const p = clamp((t - s) / (BURST - s), 0, 1);
          const r = (1 - Easing.easeInCubic(p)) * (128 + (i % 4) * 24);
          const op = t > BURST ? 0 : Math.sin(p * Math.PI) * 0.9;
          const sz = 3 + (i % 3);
          const col = i % 2 === 0 ? GOLD1 : AURA0;
          return e('div', { key: i, style: {
            position: 'absolute',
            left: Math.cos(ang) * r, top: Math.sin(ang) * r,
            width: sz, height: sz, borderRadius: '50%',
            background: col, boxShadow: `0 0 ${sz + 4}px ${col}`,
            transform: 'translate(-50%,-50%)', opacity: op,
          }});
        })
      );
    }

    // ── The charging, bursting hero coin ───────────────────────────────────
    function Coin() {
      const t = useTime();
      const inSc = animate({ from: 0, to: 1, start: 0.1, end: 0.7, ease: Easing.easeOutBack })(t);
      const inOp = animate({ from: 0, to: 1, start: 0.1, end: 0.45, ease: Easing.easeOutCubic })(t);
      const charge = clamp(animate({ from: 0, to: 1, start: 0.7, end: BURST, ease: Easing.easeInCubic })(t), 0, 1);
      const extraSpin = animate({ from: 0, to: 720, start: 0.7, end: BURST, ease: Easing.easeInCubic })(t);
      const spin = t * 60 + extraSpin;

      const shake = charge * charge * 6;
      const sx = Math.sin(t * 66) * shake;
      const sy = Math.cos(t * 74) * shake;

      const preSc = 1 + charge * 0.2 + Math.sin(t * 11) * 0.025 * charge;
      const burstSc = animate({ from: 1, to: 3.1, start: BURST, end: BURST + 0.16, ease: Easing.easeOutCubic })(t);
      const burstOp = animate({ from: 1, to: 0, start: BURST - 0.03, end: BURST + 0.1, ease: Easing.easeOutCubic })(t);

      const past = t >= BURST;
      const scale = inSc * (past ? burstSc : preSc);
      const opacity = past ? burstOp : inOp;
      const gI = 0.4 + charge * 0.6;

      const SZ = 108;
      const ringTick = (n, rad, len, w, op) => Array.from({ length: n }, (_, i) => {
        const a = (i / n) * 360;
        return e('div', { key: i, style: {
          position: 'absolute', left: '50%', top: '50%', width: w, height: len,
          background: `rgba(${RGB},${op})`,
          transform: `rotate(${a}deg) translateY(${-rad}px) translateX(-50%)`,
          transformOrigin: 'top center', borderRadius: 2,
        }});
      });

      return e('div', { style: {
        position: 'absolute', left: '50%', top: CY,
        width: SZ, height: SZ, marginLeft: -SZ / 2, marginTop: -SZ / 2,
        transform: `translate(${sx}px,${sy}px) scale(${scale})`,
        opacity: clamp(opacity, 0, 1), pointerEvents: 'none',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }},
        e('div', { style: {
          position: 'absolute', inset: -34, borderRadius: '50%',
          background: `radial-gradient(circle, rgba(${RGB},${0.36 * gI}), transparent 68%)`,
        }}),
        e('div', { style: {
          position: 'absolute', inset: -8, borderRadius: '50%',
          border: `1.5px solid rgba(${RGB},${0.4 + charge * 0.4})`,
          transform: `rotate(${spin}deg)`,
        }}, ...ringTick(22, SZ / 2 + 6, 7, 1.5, 0.35 + charge * 0.4)),
        e('div', { style: {
          position: 'absolute', inset: 14, borderRadius: '50%',
          border: `1.5px dashed rgba(${RGB},${0.5 + charge * 0.4})`,
          transform: `rotate(${-spin * 1.4}deg)`,
        }}),
        e('div', { style: { transform: `rotate(${spin * 0.5}deg)`, filter: `drop-shadow(0 0 ${18 + charge * 30}px rgba(${RGB},${0.6 + charge * 0.4}))` } },
          hexCoin(SZ * 0.72, 0)
        )
      );
    }

    function Shockwave() {
      const t = useTime();
      const p = clamp((t - BURST) / 0.55, 0, 1);
      if (p <= 0 || p >= 1) return null;
      const sc = 0.2 + Easing.easeOutCubic(p) * 3.6;
      return e('div', { style: {
        position: 'absolute', left: '50%', top: CY, width: 200, height: 200,
        marginLeft: -100, marginTop: -100, borderRadius: '50%',
        border: `2px solid rgba(${RGB},${(1 - p) * 0.85})`,
        boxShadow: `0 0 30px rgba(${RGB},${(1 - p) * 0.5})`,
        transform: `scale(${sc})`, opacity: 1 - p, pointerEvents: 'none',
      }});
    }

    // ── Coin shards flying outward at the burst ────────────────────────────
    function Shards() {
      const t = useTime();
      const p = clamp((t - BURST) / 0.8, 0, 1);
      if (p <= 0) return null;
      const N = 14;
      return e('div', { style: { position: 'absolute', left: '50%', top: CY, width: 0, height: 0, pointerEvents: 'none' } },
        ...Array.from({ length: N }, (_, i) => {
          const ang = (i / N) * Math.PI * 2 + 0.4;
          const dist = (60 + (i % 4) * 40) + Easing.easeOutCubic(p) * (160 + (i % 3) * 60);
          const rot = p * 500 * (i % 2 === 0 ? 1 : -1);
          const sz = 12 + (i % 3) * 4;
          return e('div', { key: i, style: {
            position: 'absolute',
            left: Math.cos(ang) * dist, top: Math.sin(ang) * dist,
            transform: `translate(-50%,-50%) rotate(${rot}deg)`,
            opacity: (1 - p) * 0.95,
          }}, hexCoin(sz, 0.3));
        })
      );
    }

    // ── Continuous falling coin/confetti celebration ───────────────────────
    function Confetti() {
      const t = useTime();
      if (t < BURST + 0.15) return null;
      const lt = t - (BURST + 0.15);
      const N = 20;
      return e('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' } },
        ...Array.from({ length: N }, (_, i) => {
          const seedX = (i * 53) % 100;
          const speed = 0.55 + (i % 5) * 0.09;
          const cycle = 4.2 / speed;
          const delay = (i * 0.19) % cycle;
          const lp = ((lt + delay) % cycle) / cycle;
          const y = -40 + lp * 860;
          const sway = Math.sin(lp * 10 + i) * 16;
          const rot = lp * 360 * (i % 2 === 0 ? 1 : -1) + i * 12;
          const fadeIn = clamp(lp / 0.06, 0, 1);
          const fadeOut = clamp((1 - lp) / 0.08, 0, 1);
          const op = 0.85 * Math.min(fadeIn, fadeOut);
          const isCoin = i % 3 !== 0;
          return e('div', { key: i, style: {
            position: 'absolute', left: `${seedX}%`, top: y,
            transform: `translateX(${sway}px) rotate(${rot}deg)`,
            opacity: op,
          }},
            isCoin ? hexCoin(12 + (i % 3) * 3, 0.15) :
              e('div', { style: {
                width: 8, height: 12, borderRadius: 2,
                background: i % 2 === 0 ? AURA0 : AURA1,
                boxShadow: `0 0 6px ${i % 2 === 0 ? AURA0 : AURA1}88`,
              }})
          );
        })
      );
    }

    // ── Count-up number ─────────────────────────────────────────────────────
    function useCountUp(from, to, start, end) {
      const t = useTime();
      const p = clamp(animate({ from: 0, to: 1, start, end, ease: Easing.easeOutCubic })(t), 0, 1);
      return Math.round(from + (to - from) * p);
    }

    function BonusBadge() {
      const t = useTime();
      const s = BURST + 0.7;
      const op = animate({ from: 0, to: 1, start: s, end: s + 0.3, ease: Easing.easeOutCubic })(t);
      const sc = animate({ from: 0.7, to: 1, start: s, end: s + 0.35, ease: Easing.easeOutBack })(t);
      return e('div', { style: {
        display: 'inline-flex', alignItems: 'center', padding: '4px 11px', borderRadius: 999,
        background: `${GOLD0}22`, border: `1px solid ${GOLD0}66`,
        fontFamily: mono, fontSize: 10.5, letterSpacing: '1.6px', color: GOLD0,
        opacity: op, transform: `scale(${sc})`,
      }}, bonusLabel);
    }

    function MainScene() {
      const t = useTime();
      const bgOpa = animate({ from: 0, to: 0.95, start: 0, end: 0.45, ease: Easing.easeOutCubic })(t);

      const flash = clamp(
        animate({ from: 0, to: 1, start: BURST - 0.06, end: BURST + 0.02, ease: Easing.easeOutCubic })(t) +
        animate({ from: 0, to: -1, start: BURST + 0.05, end: BURST + 0.5, ease: Easing.easeOutCubic })(t),
        0, 1);

      const reveal = animate({ from: 0, to: 1, start: BURST + 0.02, end: BURST + 0.6, ease: Easing.easeOutCubic })(t);
      const panelSc = 0.74 + reveal * 0.26;
      const panelOpa = clamp(reveal * 2.2, 0, 1);
      const glow = clamp(animate({ from: 0.4, to: 1, start: BURST + 0.1, end: BURST + 0.7, ease: Easing.easeOutCubic })(t), 0, 1);

      const kickOpa  = animate({ from: 0, to: 1, start: BURST + 0.3, end: BURST + 0.7, ease: Easing.easeOutCubic })(t);
      const titleOpa = animate({ from: 0, to: 1, start: BURST + 0.4, end: BURST + 0.8, ease: Easing.easeOutCubic })(t);
      const titleY   = animate({ from: 12, to: 0, start: BURST + 0.4, end: BURST + 0.85, ease: Easing.easeOutCubic })(t);

      const amtStart = BURST + 1.0, amtEnd = BURST + 1.9;
      const amtOpa = animate({ from: 0, to: 1, start: amtStart, end: amtStart + 0.3, ease: Easing.easeOutCubic })(t);
      const amtVal = useCountUp(0, amount, amtStart, amtEnd);

      const balStart = amtEnd + 0.15, balEnd = amtEnd + 1.1;
      const balOpa = animate({ from: 0, to: 1, start: balStart, end: balStart + 0.3, ease: Easing.easeOutCubic })(t);
      const balVal = useCountUp(oldBalance, newBalance, balStart, balEnd);

      const btnStart = balEnd + 0.35;
      const btnOpa = animate({ from: 0, to: 1, start: btnStart, end: btnStart + 0.35, ease: Easing.easeOutCubic })(t);
      const btnY   = animate({ from: 14, to: 0, start: btnStart, end: btnStart + 0.4, ease: Easing.easeOutCubic })(t);
      const pulse  = t > btnStart + 0.4 ? 0.5 + 0.5 * Math.sin((t - btnStart) * 3) : 0;

      const brA = 0.28 + glow * 0.5;

      return e('div', { 'data-screen-label': 'Bundle Purchase Reveal', style: { position: 'absolute', inset: 0, overflow: 'hidden', fontFamily: bodyF } },

        e('div', { style: { position: 'absolute', inset: 0, background: '#05070F', opacity: bgOpa } }),
        e('div', { style: {
          position: 'absolute', inset: 0, opacity: bgOpa * 0.5,
          backgroundImage: `linear-gradient(rgba(${RGB},0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(${RGB},0.05) 1px,transparent 1px)`,
          backgroundSize: '46px 46px',
        }}),

        e(Converge, null),
        e(Coin, null),
        e(Shockwave, null),
        e(Shards, null),
        e(Confetti, null),

        e('div', { style: {
          position: 'absolute', left: '50%', top: CY,
          width: PANEL_W, marginLeft: -PANEL_W / 2,
          transform: `translateY(-50%) scale(${panelSc})`,
          transformOrigin: 'center center', opacity: panelOpa,
          borderRadius: 20,
          background: 'linear-gradient(180deg, rgba(14,21,36,0.98), rgba(9,14,26,0.98))',
          border: `1px solid rgba(${RGB},${0.3 + glow * 0.45})`,
          boxShadow: [
            '0 20px 60px rgba(0,0,0,0.6)',
            `0 0 ${44 * glow}px rgba(${RGB},${glow * 0.45})`,
            `inset 0 0 ${40 * glow}px rgba(${RGB},${glow * 0.08})`,
          ].join(', '),
          overflow: 'hidden',
        }},
          e('div', { style: { position: 'absolute', top: 0, left: 0, right: 0, height: 2,
            background: `linear-gradient(90deg,transparent,${GOLD1},transparent)`,
            boxShadow: `0 0 12px ${GOLD1}` } }),

          e('div', { style: {
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '11px 16px',
            background: `linear-gradient(90deg, rgba(${RGB},0.14), rgba(${RGB},0.04))`,
            borderBottom: `1px solid rgba(${RGB},0.16)`,
          }},
            e('span', { style: { fontFamily: mono, fontSize: 10, letterSpacing: '2.5px', color: GOLD0 } }, '◈ SYSTEM'),
            e('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
              e('div', { style: { width: 5, height: 5, borderRadius: '50%', background: GOLD0, boxShadow: `0 0 6px ${GOLD0}` } }),
              e('span', { style: { fontFamily: mono, fontSize: 9, letterSpacing: '1.5px', color: GOLD0 } }, 'PURCHASE')
            )
          ),

          e('div', { style: { padding: '22px 18px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 } },
            e('span', { style: { fontFamily: mono, fontSize: 10, letterSpacing: '2.5px', color: GOLD0, opacity: kickOpa } }, 'PACK UNLOCKED'),
            e('div', { style: {
              fontFamily: disp, fontWeight: 700, fontSize: 22, color: '#E8EDF7',
              opacity: titleOpa, transform: `translateY(${titleY}px)`, textAlign: 'center',
              textShadow: `0 0 20px rgba(${RGB},${glow * 0.35})`,
            }}, packLabel),
            e(BonusBadge, null),

            e('div', { style: { height: 1, width: '100%', margin: '14px 0 4px', background: `linear-gradient(90deg,transparent,rgba(${RGB},0.25),transparent)` } }),

            e('div', { style: { display: 'flex', alignItems: 'center', gap: 10, opacity: amtOpa, marginTop: 8 } },
              hexCoin(34, 0.55),
              e('span', { style: {
                fontFamily: disp, fontWeight: 700, fontSize: 40, color: GOLD0, lineHeight: 1,
                textShadow: `0 0 24px rgba(${RGB},0.6)`,
              }}, `+${fmt(amtVal)}`)
            ),
            e('span', { style: { fontFamily: mono, fontSize: 9.5, letterSpacing: '2px', color: '#7D8AA8', opacity: amtOpa } }, `CREDS · ${price}`),

            e('div', { style: {
              marginTop: 14, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '11px 14px', borderRadius: 12, background: 'rgba(19,28,48,0.65)', border: '1px solid rgba(125,165,255,0.14)',
              opacity: balOpa,
            }},
              e('span', { style: { fontFamily: mono, fontSize: 9.5, letterSpacing: '1.6px', color: '#7D8AA8' } }, 'NEW BALANCE'),
              e('div', { style: { display: 'flex', alignItems: 'center', gap: 7 } },
                hexCoin(16, 0.3),
                e('span', { style: { fontFamily: mono, fontWeight: 700, fontSize: 15, color: '#E8EDF7' } }, fmt(balVal))
              )
            ),

            e('div', { style: {
              marginTop: 16, width: '100%', height: 48, borderRadius: 13,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9,
              background: `linear-gradient(90deg, ${AURA0}, ${AURA1})`,
              opacity: btnOpa, transform: `translateY(${btnY}px)`,
              boxShadow: `0 8px 22px rgba(77,140,255,0.32), 0 0 ${18 + pulse * 22}px rgba(157,78,221,${0.3 + pulse * 0.35})`,
            }},
              e('span', { style: { fontFamily: disp, fontWeight: 700, fontSize: 15, letterSpacing: '1.5px', color: '#fff' } }, continueLabel)
            )
          ),

          ...[
            { top: 8, left: 8, bt: 1, bl: 1 }, { top: 8, right: 8, bt: 1, br: 1 },
            { bottom: 8, left: 8, bb: 1, bl: 1 }, { bottom: 8, right: 8, bb: 1, br: 1 },
          ].map((c, i) => e('div', { key: i, style: {
            position: 'absolute', width: 15, height: 15, pointerEvents: 'none',
            top: c.top, bottom: c.bottom, left: c.left, right: c.right,
            borderTop: c.bt ? `1.5px solid rgba(${RGB},${brA})` : 'none',
            borderBottom: c.bb ? `1.5px solid rgba(${RGB},${brA})` : 'none',
            borderLeft: c.bl ? `1.5px solid rgba(${RGB},${brA})` : 'none',
            borderRight: c.br ? `1.5px solid rgba(${RGB},${brA})` : 'none',
          }})),
        ),

        e('div', { style: {
          position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 20,
          background: `radial-gradient(circle at 50% ${CY}, #ffffff, rgba(${RGB},0.9) 45%, transparent 80%)`,
          opacity: flash,
        }})
      );
    }

    return { ...base, scene: e(MainScene, null) };
  }
}

</script>
</body>
</html>
